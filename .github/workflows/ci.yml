name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format check)
        run: |
          ruff check --output-format github .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Actionlint (workflow self-check)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/rhysd/actionlint:latest

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (unit) with coverage
        run: >-
          pytest -m "not integration" --cov=bot --cov-report=term-missing
          --cov-report=xml -q
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=total |
            xargs -I{} echo "Total coverage: **{}%**" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (integration, local HTTP servers only — no internet needed)
        run: pytest -m integration -q

  security:
    name: Dependency audit & SBOM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements.txt --strict
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  docker-build:
    name: Docker build (PR validation)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: telegram-rss-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest-validation:
    name: Kubernetes manifests (kubeconform)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kubeconform-action@v1.6.0
        with:
          strict: true
          summary: true
          manifests: kubernetes/kube-manifest.yaml
