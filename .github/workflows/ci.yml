name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format check)
        run: |
          ruff check --output-format github .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Actionlint (workflow self-check)
        # ghcr.io refuses anonymous pulls of this image: its token endpoint answers
        # 403 DENIED. The pinned release binary is downloaded from github.com instead
        # and verified against the published SHA-256 before being executed.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sum="$ACTIONLINT_SHA256_AMD64" ;;
            aarch64|arm64) arch=arm64; sum="$ACTIONLINT_SHA256_ARM64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "$sum  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (unit) with coverage
        run: >-
          pytest -m "not integration" --cov=bot --cov-report=term-missing
          --cov-report=xml -q
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=total |
            xargs -I{} echo "Total coverage: **{}%**" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (integration, local HTTP servers only — no internet needed)
        run: pytest -m integration -q

  security:
    name: Dependency audit & SBOM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements.txt --strict
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  docker-build:
    name: Docker build (PR validation)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: telegram-rss-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest-validation:
    name: Kubernetes manifests (kubeconform)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      # There is no official helm/kubeconform-action, so the pinned release binary is
      # fetched from github.com and checked against the published checksum before use.
      - name: Validate manifests with kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBERNETES_VERSION: 1.33.0
          KUBECONFORM_SHA256_AMD64: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          KUBECONFORM_SHA256_ARM64: 1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sum="$KUBECONFORM_SHA256_AMD64" ;;
            aarch64|arm64) arch=arm64; sum="$KUBECONFORM_SHA256_ARM64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="kubeconform-linux-${arch}.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          echo "$sum  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -verbose \
            -kubernetes-version "$KUBERNETES_VERSION" kubernetes/
