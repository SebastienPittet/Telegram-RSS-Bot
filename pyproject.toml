# Development tooling configuration.
# The project itself stays a plain script package (no build-system needed).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["bot"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: marks tests requiring network access (deselect with '-m \"not integration\"')",
    "network: marks tests that require internet access",
]
